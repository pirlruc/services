# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: 
    - main

  pull_request:
    # The branches below must be a subset of the branches above
    branches:
    - main
    
  schedule:
    - cron: '41 18 * * 4'

  # Runs this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:        
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    - name: Manual Build
      run: |
        echo "1. Installing dependencies..."
        sudo apt-get install ninja-build
        sudo apt-get install lcov
        sudo apt-get install clang-17
        sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-17   100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-17 100
        sudo update-alternatives --set clang   /usr/bin/clang-17
        sudo update-alternatives --set clang++ /usr/bin/clang++-17        
        ninja    --version
        cmake    --version
        gcc      --version
        gcc-13   --version
        clang    --version
        clang-17 --version
        lcov     --version
        vcpkg    --version

        echo "2. Removing previous builds..."
        rm -rf out
        rm -rf build
        mkdir build

        echo "3. Configuring compilation job..."
        export VCPKG_ROOT=/usr/local/share/vcpkg
        cmake --preset "clang-release"

        echo "4. Building and installing library..."
        cmake --build --preset "clang-release" --target all
        cmake --build --preset "clang-release" --target install

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
